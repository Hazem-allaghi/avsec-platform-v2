<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>AVSEC Platform — Supervisor Dashboard (AAW)</title>
<style>
  :root{--bg:#0b1220;--panel:#121b2e;--line:#22314d;--txt:#e6edf7;--muted:#8ea0c0;
        --green:#2ecc71;--amber:#f1c40f;--red:#e74c3c;--blue:#4c8bf5;}
  *{box-sizing:border-box;font-family:-apple-system,Segoe UI,Tahoma,Arial,sans-serif}
  body{margin:0;background:var(--bg);color:var(--txt)}
  header{padding:16px 24px;background:var(--panel);border-bottom:1px solid var(--line);
         display:flex;justify-content:space-between;align-items:center}
  header h1{font-size:18px;margin:0}
  header .sub{color:var(--muted);font-size:13px}
  main{padding:20px;max-width:1100px;margin:0 auto}
  .row{display:flex;gap:16px;flex-wrap:wrap}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;flex:1;min-width:280px}
  .flights{display:grid;gap:12px;margin-top:16px}
  .flight{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px}
  .flight .top{display:flex;justify-content:space-between;align-items:center}
  .flight .num{font-weight:700;font-size:16px}
  .badge{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
  .b-PENDING{background:#2c3550;color:#c9d4ea}
  .b-IN_PROGRESS{background:#2b3d63;color:#9fc1ff}
  .b-BLOCKED{background:#5a2530;color:#ff9aa8}
  .b-CLEARED{background:#1e4a33;color:#7ee6ab}
  .b-EMERGENCY{background:var(--red);color:#fff}
  .b-DEPARTED{background:#333;color:#aaa}
  .threat-GREEN{color:var(--green)} .threat-AMBER{color:var(--amber)} .threat-RED{color:var(--red)}
  .stages{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .stage{font-size:11px;padding:4px 8px;border-radius:6px;background:#1a2438;border:1px solid var(--line)}
  .stage.PASSED{border-color:var(--green);color:var(--green)}
  .stage.FAILED{border-color:var(--red);color:var(--red)}
  .stage.IN_PROGRESS{border-color:var(--blue);color:var(--blue)}
  .reasons{margin-top:10px;font-size:13px;color:#ffb4b4}
  .reasons li{margin-bottom:3px}
  button{background:var(--blue);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font-size:13px}
  button:hover{opacity:.9}
  button.secondary{background:#2c3550}
  .muted{color:var(--muted);font-size:12px}
  input,select{background:#0e1626;border:1px solid var(--line);color:var(--txt);padding:8px;border-radius:6px}
  .newflight{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  #status{position:fixed;bottom:14px;left:14px;background:#1a2438;padding:8px 14px;border-radius:8px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div>
    <h1>🛡️ AVSEC Platform — لوحة المشرف</h1>
    <div class="sub">Afriqiyah Airways (AAW) — Tenant: AAW · Manual: AAWSM Rev01-2021</div>
  </div>
  <button onclick="loadFlights()">تحديث ⟳</button>
</header>
<main>
  <div class="card">
    <strong>إنشاء رحلة جديدة (Demo)</strong>
    <div class="newflight">
      <input id="fn" placeholder="رقم الرحلة (8U214)" style="width:140px">
      <input id="ar" placeholder="تسجيل الطائرة" style="width:120px">
      <select id="at"><option>A320</option><option>A319</option><option>A330</option></select>
      <select id="tl"><option value="GREEN">Green</option><option value="AMBER">Amber</option><option value="RED">Red</option></select>
      <button onclick="createFlight()">إنشاء</button>
    </div>
    <div class="muted" style="margin-top:6px">API: <span id="apiBase"></span></div>
  </div>

  <div class="flights" id="flights"></div>
</main>
<div id="status">جاري التحميل...</div>

<script>
const BASE = window.location.origin.includes('5055') ? window.location.origin : 'http://127.0.0.1:5055';
document.getElementById('apiBase').textContent = BASE;

async function api(path, opts={}) {
  const r = await fetch(BASE + path, {headers:{'Content-Type':'application/json'}, ...opts});
  return {status:r.status, body: await r.json().catch(()=>({}))};
}

async function createFlight(){
  const body = {
    airline_id:'AAW',
    flight_number: document.getElementById('fn').value || '8U000',
    aircraft_reg: document.getElementById('ar').value || '5A-DEMO',
    aircraft_type: document.getElementById('at').value,
    threat_level: document.getElementById('tl').value,
    departure_airport:'MJI', destination:'---', created_by:'u-sup1'
  };
  const {status, body:resp} = await api('/flights', {method:'POST', body: JSON.stringify(body)});
  setStatus(status===201 ? 'تم إنشاء الرحلة '+resp.flight_number : 'خطأ: '+JSON.stringify(resp));
  loadFlights();
}

function setStatus(msg){ document.getElementById('status').textContent = msg; }

async function loadFlights(){
  setStatus('تحديث...');
  const {status, body} = await api('/flights?airline_id=AAW');
  if (status !== 200){ setStatus('تعذر الاتصال بـ API على '+BASE); return; }
  const el = document.getElementById('flights');
  el.innerHTML = '';
  for (const f of body) {
    const detail = await api(`/flights/${f.flight_id}`);
    const clearance = await api(`/flights/${f.flight_id}/clearance`);
    el.appendChild(renderFlight(f, detail.body, clearance.body));
  }
  setStatus('آخر تحديث: ' + new Date().toLocaleTimeString('ar'));
}

function renderFlight(f, detail, clearance){
  const div = document.createElement('div');
  div.className = 'flight';
  const stages = (detail.stages||[]).map(s =>
    `<span class="stage ${s.status}">${s.stage_code} · ${s.status}</span>`).join('');
  const failedReasons = (clearance.results||[]).filter(r=>!r.passed);
  const reasonsHtml = failedReasons.length
    ? `<ul class="reasons">${failedReasons.map(r=>`<li>❌ [${r.rule_id}] ${r.reason||r.description}</li>`).join('')}</ul>`
    : `<div class="muted" style="color:#7ee6ab;margin-top:8px">✅ لا توجد شروط حظر متبقية</div>`;
  const emergencyBtn = f.security_status !== 'EMERGENCY'
    ? `<button class="secondary" onclick="openEmergency('${f.flight_id}')">🚨 فتح حالة طوارئ</button>`
    : `<button onclick="closeEmergency('${f.flight_id}', '${(detail.emergencies||[]).find(e=>e.status==='OPEN')?.event_id||''}')">إغلاق الطوارئ</button>`;

  div.innerHTML = `
    <div class="top">
      <div>
        <span class="num">${f.flight_number}</span>
        <span class="muted"> · ${f.aircraft_reg} (${f.aircraft_type}) · ${f.departure_airport} → ${f.destination}</span>
        <span class="threat-${f.threat_level}" style="margin-right:10px">● Threat: ${f.threat_level}</span>
      </div>
      <span class="badge b-${f.security_status}">${f.security_status}</span>
    </div>
    <div class="stages">${stages}</div>
    ${reasonsHtml}
    <div style="margin-top:10px;display:flex;gap:8px">
      ${emergencyBtn}
    </div>
  `;
  return div;
}

async function openEmergency(flightId){
  const type = prompt('نوع الحدث (BOMB_THREAT / SUSPECT_ITEM / UNLAWFUL_INTERFERENCE):', 'SUSPECT_ITEM');
  if (!type) return;
  await api(`/flights/${flightId}/emergency`, {method:'POST', body: JSON.stringify({
    event_type: type, opened_by: 'u-sup1', notes: 'Opened from dashboard'
  })});
  loadFlights();
}

async function closeEmergency(flightId, eventId){
  if (!eventId) return;
  await api(`/emergency/${eventId}/close`, {method:'POST', body: JSON.stringify({closed_by:'u-sup1'})});
  loadFlights();
}

loadFlights();
setInterval(loadFlights, 15000);
</script>
</body>
</html>
